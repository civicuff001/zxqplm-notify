# Commands are processed on a schedule now (every 5 min) — there is no
# always-on daemon host, so without this /subscribe is never processed and
# the subscriber list stays empty (nobody ever gets an alert).
# NOTE: run this ONLY while no daemon is running: both consumers call
# getUpdates, so running this while a daemon is up will swallow updates /
# double-reply.
name: Subscribe — processes bot commands on a schedule

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  subscribe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Poll getUpdates and process commands
        run: node src/subscribe.js
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
